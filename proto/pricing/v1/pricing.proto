syntax = "proto3";

package pricing.v1;

option go_package = "github.com/skalgutkar/grpc-catalog-platform/gen/pricing/v1;pricingv1";

// PricingService is internal-only: it's never exposed over REST, only
// called service-to-service by catalog-service over gRPC. This is the
// half of the demo REST can't show — a plain gRPC client/server pair
// with no gateway in front of it.
service PricingService {
  rpc GetPrice(GetPriceRequest) returns (GetPriceResponse);
}

message GetPriceRequest {
  string product_id = 1;
  int64 unit_price_cents = 2;
  int32 quantity = 3;
}

message GetPriceResponse {
  string product_id = 1;
  int32 quantity = 2;
  int32 discount_percent = 3;
  int64 total_price_cents = 4;
}
