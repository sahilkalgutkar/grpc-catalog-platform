services:
  pricing-service:
    build:
      context: .
      dockerfile: services/pricing-service/Dockerfile

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    ports:
      - "${GRPC_HOST_PORT:-9090}:9090"
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      PRICING_SERVICE_ADDR: pricing-service:9091
    depends_on:
      - pricing-service
